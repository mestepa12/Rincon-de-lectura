    <!-- Google tag (gtag.js): solo con consentimiento (ver consentimiento.js) -->
<script>
  // gtag.js pesa 169 KiB. Aunque va async, en 4G lenta ocupa la tuberia
  // durante toda la ventana del LCP y retrasa la descarga de las fuentes.
  // Con consentimiento, se aplaza hasta que el hilo queda libre despues de
  // load, o hasta la primera interaccion si llega antes. La cola de gtag (js
  // y config) la crea consentimiento.js antes de llamar aqui, asi que ningun
  // gtag() posterior se pierde. Sin consentimiento esto no se llama nunca:
  // ni cola, ni gtag.js, ni cookies.
  rinconConsentimiento.alAceptar(function (cargarGtag, aceptadoAhora) {
    // Recien pulsado "Aceptar": la pagina ya esta en marcha, se pide ya.
    if (aceptadoAhora) { cargarGtag(); return; }
    function programar() {
      // El timeout asegura la carga aunque la pagina nunca quede ociosa.
      if ('requestIdleCallback' in window) requestIdleCallback(cargarGtag, { timeout: 4000 });
      else setTimeout(cargarGtag, 1500);
    }
    if (document.readyState === 'complete') programar();
    else window.addEventListener('load', programar, { once: true });
    // Si el usuario interactua o se va antes de que el hilo quede libre,
    // se carga ya: asi no se pierde la sesion de quien rebota rapido.
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, cargarGtag, { once: true, passive: true });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') cargarGtag();
    }, { once: true });
  });
</script>
