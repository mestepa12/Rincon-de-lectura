<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--consentimiento-->
    <title>Elige tu nombre - Mi Rincón de Lectura</title>
    <meta name="description" content="Elige tu nombre de usuario para Mi Rincón de Lectura.">
    <link rel="canonical" href="https://rinconlectura.es/onboarding">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <!-- Google tag (gtag.js): solo con consentimiento (ver consentimiento.js) -->
<script>
  // gtag.js pesa 169 KiB. Aunque va async, en 4G lenta ocupa la tuberia
  // durante toda la ventana del LCP y retrasa la descarga de las fuentes.
  // Con consentimiento, se aplaza hasta que el hilo queda libre despues de
  // load, o hasta la primera interaccion si llega antes. La cola de gtag (js
  // y config) la crea consentimiento.js antes de llamar aqui, asi que ningun
  // gtag() posterior se pierde. Sin consentimiento esto no se llama nunca:
  // ni cola, ni gtag.js, ni cookies.
  rinconConsentimiento.alAceptar(function (cargarGtag, aceptadoAhora) {
    // Recien pulsado "Aceptar": la pagina ya esta en marcha, se pide ya.
    if (aceptadoAhora) { cargarGtag(); return; }
    function programar() {
      // El timeout asegura la carga aunque la pagina nunca quede ociosa.
      if ('requestIdleCallback' in window) requestIdleCallback(cargarGtag, { timeout: 4000 });
      else setTimeout(cargarGtag, 1500);
    }
    if (document.readyState === 'complete') programar();
    else window.addEventListener('load', programar, { once: true });
    // Si el usuario interactua o se va antes de que el hilo quede libre,
    // se carga ya: asi no se pierde la sesion de quien rebota rapido.
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, cargarGtag, { once: true, passive: true });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') cargarGtag();
    }, { once: true });
  });
</script>
</head>
<body class="login-page">

    <div class="login-container">
        <h1>¡Casi listo!</h1>
        <!-- Cuenta activa: esta pantalla ya está autenticada, así que aquí
             también tiene que verse con qué sesión se está entrando. -->
        <p id="cuenta-activa" class="cuenta-activa cuenta-activa--claro" hidden>
            <span class="cuenta-activa-etiqueta">Sesión de</span>
            <span id="cuenta-activa-correo" class="cuenta-activa-correo"></span>
        </p>
        <p style="margin-bottom: 1.2rem; line-height: 1.5;">Elige tu nombre de usuario para Rincón de Lectura. Así te encontrarán tus amigos.</p>
        <form id="onboarding-form">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" required autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="p. ej. lector_nocturno">
            <p style="margin: 4px 0 0; font-size: 12px; color: var(--accessible-muted-color);">Entre 3 y 30 caracteres: letras, números y guion bajo.</p>
            <p style="margin: 4px 0 0; font-size: 12px; color: var(--accessible-muted-color);">Lo verán las demás personas; no hace falta que sea tu nombre real.</p>

            <button type="submit" class="btn-primary" id="onboarding-submit">Empezar a leer</button>
            <p id="onboarding-error" class="error-message"></p>
        </form>
        <p class="auth-legal"><a href="privacidad.html">Política de privacidad</a> · <button type="button" class="enlace-boton" data-abrir-consentimiento>Preferencias de cookies</button></p>
    </div>

    <script type="module" src="onboarding.js"></script>

    </body>
</html>
